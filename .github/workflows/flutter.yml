name: Flutter Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          build-tools-version: 35.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Kill Java Processes
        run: |
          pkill -9 java || true
          sleep 2

      - name: Clean Everything
        run: |
          flutter clean
          rm -rf build/
          rm -rf .dart_tool/
          rm -rf pubspec.lock
          rm -rf android/.gradle/
          rm -rf android/build/
          rm -rf ~/.gradle/

      - name: Copy gradle.properties
        run: cp android/gradle.properties.github android/gradle.properties

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Find APK Files
        if: always()
        run: |
          echo "=== Searching for APK files ==="
          find /home/runner/work/Zqwis-Apis-Flutter -name "*.apk" -type f 2>/dev/null
          
          echo ""
          echo "=== Build folder structure ==="
          ls -la build/app/outputs/ 2>/dev/null || echo "No build/app/outputs/"
          
          echo ""
          echo "=== Full build tree ==="
          tree -L 4 build/app/ 2>/dev/null || find build/app -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zqwis-release
          path: build/app/outputs/flutter-apk/

      - name: List Uploaded Files
        if: always()
        run: ls -lah build/app/outputs/flutter-apk/ || echo "No files found"