name: Flutter Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          build-tools-version: 35.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Kill Java Processes
        run: |
          pkill -9 java || true
          sleep 2

      - name: Clean Everything
        run: |
          flutter clean
          rm -rf build/
          rm -rf .dart_tool/
          rm -rf pubspec.lock
          rm -rf android/.gradle/
          rm -rf android/build/
          rm -rf ~/.gradle/

      - name: Copy gradle.properties untuk GitHub Actions
        run: cp android/gradle.properties.github android/gradle.properties

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK with Verbose
        run: flutter build apk --release --target-platform android-arm64 --verbose 2>&1 | tee build.log

      - name: Show Build Log
        if: failure()
        run: |
          echo "=== BUILD LOG ===" 
          tail -200 build.log

      - name: Check APK Output
        if: success()
        run: |
          ls -la build/app/outputs/flutter-apk/
          du -sh build/app/outputs/flutter-apk/*

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zqwis-release
          path: build/app/outputs/flutter-apk/app-release.apk