name: zqwis
description: Zqwis APIS - All In One
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.4.3+1
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  go_router: ^13.2.1
  provider: ^6.1.2
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.2
  path_provider: ^2.1.2
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  fluttertoast: ^9.1.0  
  visibility_detector: ^0.4.0+2  
  file_picker: ^8.0.3
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: true
  image_path: assets/logoapk1.png
  adaptive_icon_background: "#11182B"
  adaptive_icon_foreground: assets/logoapk2.png
  min_sdk_android: 21